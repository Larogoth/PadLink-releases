<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Only the site (https://larogoth.github.io/) goes to Google: the API key is limited to it. -->
<meta name="referrer" content="strict-origin">
<title>PadLink · Google Drive</title>
<link rel="icon" href="../icon.png">
<link rel="stylesheet" href="../style.css">
<style>
  .pick { text-align: center; padding: 34px 22px; }
  .pick h1 { font-size: 24px; }
  .pick .button { margin-top: 10px; min-width: 260px; }
  #where { font-size: 14px; margin-top: 18px; }
  #msg { margin-top: 16px; }
  #msg.warn { color: var(--warn); }
  .link { border: 0; background: none; padding: 6px; color: var(--blue); font: inherit; font-size: 15px; text-decoration: underline; cursor: pointer; }
  .link[hidden] { display: none; }
  .done { display: none; }
  body.is-done .pick-start { display: none; }
  body.is-done .done { display: block; }
  .list-box { display: none; text-align: left; margin: 6px 0 14px; }
  body.has-files .list-box { display: block; }
  body.has-files .intro { display: none; }
  .tools { display: flex; gap: 8px; }
  .tools input, .tools select { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 16px; padding: 0 12px; }
  .tools input { flex: 1; min-width: 0; }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 6px; }
  .chip { height: 34px; padding: 0 14px; border-radius: 17px; border: 0; background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .chip i { font-style: normal; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .chip.on { background: var(--blue); color: var(--blue-ink); }
  .chip.on i { color: inherit; opacity: .8; }
  #count { font-size: 13px; margin: 6px 2px; }
  #files { max-height: min(52vh, 460px); overflow-y: auto; -webkit-overflow-scrolling: touch; border-top: 1px solid var(--line); }
  .file { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 6px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .file:active { background: var(--bg); }
  .badge { width: 40px; height: 48px; border-radius: 6px; display: grid; place-items: center; flex: none; color: #fff; font-size: 9px; font-weight: 800; letter-spacing: .02em; }
  .k-pdf { background: #e03131; } .k-slides { background: #f59f00; } .k-docs { background: #4285f4; } .k-sheets { background: #0f9d58; }
  .k-drawings { background: #d6336c; } .k-pictures { background: #1971c2; } .k-other { background: #868e96; }
  .file .text { display: flex; flex-direction: column; min-width: 0; }
  .file b { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file small { font-size: 13px; color: var(--muted); }
  .none { padding: 14px 4px; }
  .account { margin: 14px 0 0; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
  .account[hidden] { display: none; }
  .account b { color: var(--ink); font-weight: 600; }
  /* With the list: account, then the new-file button, then the list, so nothing hides under the phone's toolbars */
  body.has-files .pick-start { display: flex; flex-direction: column; align-items: center; }
  body.has-files .pick-start > h1 { order: 0; margin-bottom: 4px; }
  body.has-files #account { order: 1; margin-top: 0; }
  body.has-files .switch-row { order: 2; margin: 0; }
  body.has-files #open { order: 3; }
  body.has-files #msg { order: 4; }
  body.has-files .list-box { order: 5; align-self: stretch; margin-top: 14px; }
  body.has-files #where { order: 6; }
  @media (max-width: 600px) {
    body.has-files .pick { padding: 20px 14px; }
    body.has-files .pick-start > h1 { font-size: 21px; }
    body.has-files #open { min-width: 0; width: 100%; font-size: 16px; padding-left: 12px; padding-right: 12px; }
    #files { max-height: none; overflow: visible; } /* the page scrolls, not a box inside it */
    .tools select { flex: none; }
  }
</style>
</head>
<body>
<main>
  <header class="site"><img src="../icon.png" alt=""><a href="../">PadLink</a></header>

  <div class="card pick">
    <div class="pick-start">
      <h1>Add from Google Drive</h1>
      <p class="muted intro">Pick a file for your whiteboard. PadLink only gets that one file.</p>
      <div class="list-box">
        <div class="tools">
          <input id="find" type="search" placeholder="Search your files" autocomplete="off" spellcheck="false">
          <select id="sort" aria-label="Sort"><option value="recent">Recent</option><option value="name">Name A–Z</option></select>
        </div>
        <div id="chips"></div>
        <p id="count" class="muted"></p>
        <div id="files"></div>
      </div>
      <button class="button" id="open" disabled>
        <svg viewBox="0 0 87.3 78" aria-hidden="true"><path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/><path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/><path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/><path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/><path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/><path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/></svg>
        <span id="openLabel">Choose from Google Drive</span>
      </button>
      <p id="account" class="account" hidden>Google account: <b id="accountEmail"></b></p>
      <p id="msg" class="muted" hidden></p>
      <p class="switch-row"><button class="link" id="switch" hidden>Use a different Google account</button></p>
      <p id="where" class="muted"></p>
    </div>
    <div class="done">
      <h1>Sending it to PadLink…</h1>
    </div>
  </div>

  <footer class="site"><a href="../">About PadLink</a> · <a href="../privacy.html">Privacy policy</a></footer>
</main>

<script src="config.js"></script>
<script src="picker.js"></script>
<script src="https://accounts.google.com/gsi/client" async onload="PadLinkPicker.gisLoaded()"></script>
<script src="https://apis.google.com/js/api.js" async onload="PadLinkPicker.gapiLoaded()"></script>
</body>
</html>
