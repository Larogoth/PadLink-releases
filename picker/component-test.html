<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin">
<meta name="robots" content="noindex">
<title>PadLink · Drive picker test</title>
<link rel="icon" href="../icon.png">
<link rel="stylesheet" href="../style.css">
<style>
  .pick { text-align: center; padding: 30px 22px; }
  .pick .button { margin: 8px 0; min-width: 260px; }
  #log { text-align: left; font: 14px/1.5 ui-monospace, Menlo, monospace; background: #f4f6fb; border-radius: 12px; padding: 12px; margin-top: 16px; white-space: pre-wrap; min-height: 80px; }
</style>
</head>
<body>
<main>
  <header class="site"><img src="../icon.png" alt=""><a href="../">PadLink</a></header>
  <div class="card pick">
    <h1>Drive picker test</h1>
    <p class="muted">A test of Google's newer picker (the web component). It only shows what you picked here: nothing goes to PadLink.</p>
    <button class="button" id="open">Open the picker</button>
    <p><button class="button" id="other" style="background:#eef2fb;color:#1d2433">Open with account list</button></p>
    <div id="log"></div>
  </div>
</main>
<script src="config.js"></script>
<script src="https://unpkg.com/@googleworkspace/drive-picker-element@0.7.3/dist/index.iife.min.js"></script>
<script>
(() => {
  'use strict';
  const cfg = window.PADLINK_GOOGLE || {};
  const ACCOUNT = 'padlink-picker.account';
  const log = (t) => { document.getElementById('log').textContent += new Date().toLocaleTimeString() + '  ' + t + '\n'; };
  const saved = () => { try { return localStorage.getItem(ACCOUNT) || ''; } catch { return ''; } };
  let token = '';
  log('Ready. Tap a button. Saved account: ' + (saved() || 'none'));

  function open(prompt) {
    document.querySelectorAll('drive-picker').forEach((e) => e.remove());
    const p = document.createElement('drive-picker');
    p.setAttribute('client-id', cfg.clientId);
    p.setAttribute('app-id', cfg.appId);
    p.setAttribute('developer-key', cfg.apiKey);
    p.setAttribute('scope', 'https://www.googleapis.com/auth/drive.file');
    p.setAttribute('title', 'Pick a file for the whiteboard (test)');
    if (prompt) p.setAttribute('prompt', prompt);
    else if (saved()) p.setAttribute('login-hint', saved());
    if (token) p.setAttribute('oauth-token', token);
    const v = document.createElement('drive-picker-docs-view');
    v.setAttribute('mime-types', 'application/pdf,image/png,image/jpeg,application/vnd.google-apps.presentation,application/vnd.google-apps.document');
    p.appendChild(v);
    p.addEventListener('picker-oauth-response', async (e) => {
      token = e.detail.access_token || '';
      log('Signed in (token for ' + Math.round((e.detail.expires_in || 0) / 60) + ' min).');
      try {
        const r = await fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)', { headers: { Authorization: 'Bearer ' + token } });
        const email = r.ok ? ((await r.json()).user || {}).emailAddress : '';
        if (email) { localStorage.setItem(ACCOUNT, email); log('Account: ' + email); }
      } catch { /* fine */ }
    });
    p.addEventListener('picker-picked', (e) => { (e.detail.docs || []).forEach((d) => log('PICKED: ' + d.name + ' (' + d.mimeType + ')')); });
    p.addEventListener('picker-canceled', () => log('Closed without picking.'));
    p.addEventListener('picker-error', (e) => log('ERROR: ' + (e.detail && (e.detail.message || e.detail.type) || e.detail)));
    document.body.appendChild(p);
    log('Opening' + (prompt ? ' (' + prompt + ')' : saved() ? ' as ' + saved() : '') + '…');
  }

  document.getElementById('open').addEventListener('click', () => open(''));
  document.getElementById('other').addEventListener('click', () => { token = ''; try { localStorage.removeItem(ACCOUNT); } catch { /* fine */ } open('select_account'); });
})();
</script>
</body>
</html>
